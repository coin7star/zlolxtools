<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zlolxWorkspaceTool - AI Groq</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #1a1a3e, #24243e);
            color: white;
            padding: 1.5rem;
            min-height: 100vh;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 1rem; }
        .chat-card {
            background: rgba(20,20,45,0.8);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .chat-messages {
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 1rem;
            height: 400px;
            overflow-y: auto;
            margin-bottom: 1rem;
        }
        .message { margin-bottom: 12px; display: flex; }
        .message.user { justify-content: flex-end; }
        .message.bot .bubble {
            background: rgba(50,50,90,0.8);
            padding: 8px 14px;
            border-radius: 18px 18px 18px 4px;
            max-width: 80%;
        }
        .message.user .bubble {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            padding: 8px 14px;
            border-radius: 18px 18px 4px 18px;
            max-width: 80%;
        }
        .chat-input-area {
            display: flex;
            gap: 8px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 40px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            font-family: inherit;
        }
        button {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            border: none;
            color: white;
            padding: 0 24px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover { opacity: 0.85; }
        .footer { text-align: center; margin-top: 1rem; font-size: 0.7rem; color: #8892b0; }
    </style>
</head>
<body>
<div class="container">
    <h1>🤖 zlolx AI (Groq)</h1>
    <div class="chat-card">
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="bubble">Halo! Saya AI dengan Groq. Tanya apa saja! 🚀</div>
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Ketik pesan...">
            <button id="sendBtn">Kirim</button>
        </div>
    </div>
    <div class="footer">
        🔐 API key aman tersimpan di Cloudflare Environment Variable
    </div>
</div>

<script>
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function addMessage(role, text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;
        msgDiv.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendMessage() {
        const userMessage = chatInput.value.trim();
        if (!userMessage) return;

        addMessage('user', userMessage);
        chatInput.value = '';
        
        // Loading indicator
        addMessage('bot', '⏳ Sedang berpikir...');
        const loadingMsg = chatMessages.lastChild;

        try {
            // Panggil endpoint proxy (API key tersimpan di backend Cloudflare)
            const response = await fetch('/api/groq', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: 'mixtral-8x7b-32768',
                    messages: [
                        { role: 'user', content: userMessage }
                    ],
                    temperature: 0.7
                })
            });

            const data = await response.json();
            
            // Hapus loading message
            if (loadingMsg && loadingMsg.parentNode) loadingMsg.remove();
            
            if (data.error) {
                addMessage('bot', `Error: ${data.error}`);
            } else {
                const reply = data.choices?.[0]?.message?.content || 'Maaf, tidak ada respons.';
                addMessage('bot', reply);
            }
        } catch (error) {
            if (loadingMsg && loadingMsg.parentNode) loadingMsg.remove();
            addMessage('bot', `Error: ${error.message}`);
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
