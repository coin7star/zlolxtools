<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zlolx AI - Groq Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #1a1a3e, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .chat-container {
            max-width: 800px;
            width: 100%;
            background: rgba(20, 20, 45, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            box-shadow: 0 25px 45px rgba(0,0,0,0.3);
        }
        .header {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            padding: 1.2rem;
            text-align: center;
        }
        .header h1 {
            color: white;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .header p {
            color: rgba(255,255,255,0.8);
            font-size: 0.8rem;
            margin-top: 5px;
        }
        .chat-messages {
            height: 400px;
            overflow-y: auto;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            display: flex;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            justify-content: flex-end;
        }
        .message.bot {
            justify-content: flex-start;
        }
        .bubble {
            max-width: 75%;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .message.user .bubble {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: white;
            border-radius: 20px 20px 4px 20px;
        }
        .message.bot .bubble {
            background: rgba(50, 50, 90, 0.9);
            color: #f0f0f0;
            border-radius: 20px 20px 20px 4px;
        }
        .input-area {
            display: flex;
            gap: 10px;
            padding: 1.2rem;
            background: rgba(0,0,0,0.3);
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .input-area input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.4);
            border-radius: 40px;
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }
        .input-area input:focus {
            border-color: #00d2ff;
        }
        .input-area input::placeholder {
            color: #8892b0;
        }
        .input-area button {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            border: none;
            padding: 0 24px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .input-area button:hover {
            opacity: 0.85;
            transform: scale(0.98);
        }
        .footer {
            text-align: center;
            padding: 0.8rem;
            font-size: 0.65rem;
            color: #6c7a9e;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .typing {
            font-style: italic;
            opacity: 0.7;
        }
        @media (max-width: 600px) {
            .bubble { max-width: 85%; }
            .chat-messages { height: 350px; }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <h1>
                <span>🤖</span> zlolx AI
            </h1>
            <p>Powered by Groq • API key aman di Cloudflare</p>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="bubble">Halo! Saya AI Groq. Ada yang bisa saya bantu? 😊</div>
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="chatInput" placeholder="Ketik pesan..." autofocus>
            <button id="sendBtn">Kirim</button>
        </div>
        <div class="footer">
            🔐 API key tersimpan di Cloudflare Environment Variable (GROQ_API_KEY)
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function addMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = '<div class="bubble typing">⏳ Sedang berpikir...</div>';
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        async function sendMessage() {
            const userMessage = chatInput.value.trim();
            if (!userMessage) return;

            addMessage('user', userMessage);
            chatInput.value = '';
            showTyping();

            try {
                const response = await fetch('/api/groq', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        messages: [
                            { role: 'user', content: userMessage }
                        ]
                    })
                });

                const data = await response.json();
                hideTyping();

                if (data.error) {
                    addMessage('bot', `❌ Error: ${data.error}`);
                } else if (data.choices && data.choices[0] && data.choices[0].message) {
                    addMessage('bot', data.choices[0].message.content);
                } else {
                    addMessage('bot', '❌ Maaf, terjadi kesalahan. Coba lagi nanti.');
                }

            } catch (error) {
                hideTyping();
                addMessage('bot', `❌ Network error: ${error.message}`);
                console.error('Error:', error);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
